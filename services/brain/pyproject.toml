[project]
name = "freewill-brain"
version = "0.2.0"
description = "Local evolving decision service for Freewill"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "numpy>=2,<3",
  "pydantic>=2.10,<3",
  "safetensors>=0.5,<1",
  "torch>=2.5,<3",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
test = ["httpx>=0.28,<1", "pytest>=8,<9"]

[project.scripts]
freewill-brain = "freewill_brain.api:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

